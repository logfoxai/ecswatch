name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci

      # Discrete check-only steps (no --fix) so a failure points at the exact
      # gate. `npm run validate` is the local equivalent and also auto-fixes.
      - name: Lint (eslint)
        run: npm run lint:check

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Build (esbuild)
        run: npm run build

      - name: Test (kizu)
        run: npm run test
